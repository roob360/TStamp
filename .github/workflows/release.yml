name: Rilis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun TStamp.exe (portable)
        run: npx electron-builder --win portable --publish never -c.win.signAndEditExecutable=true

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: TStamp-portable
          path: dist/TStamp.exe

      - name: Buat rilis
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TStamp.exe
          body: |
            ## TStamp ${{ github.ref_name }}

            Aplikasi desktop untuk menambahkan timestamp, lokasi, hashtag, dan logo pada foto, untuk laporan logbook.

            ### Cara pakai
            1. Unduh `TStamp.exe` di bawah ini.
            2. Klik dua kali untuk menjalankan. Tidak perlu instalasi.

            ### Catatan
            - Untuk Windows 10 atau 11 64-bit.
            - File ini belum ditandatangani digital. Jika Windows SmartScreen muncul, klik "More info", lalu "Run anyway".
